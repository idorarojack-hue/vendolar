            :root {

            /* Vindolar boot screen. Lives here (not in .scss) so it paints before the JS bundle.
               Markup: src/components/vindolar/boot-screen.tsx and the static copy in #root below. */
            .vd-boot {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: grid;
                place-items: center;
                padding: 1.6rem;
                overflow: hidden;
                background: #1a0b03;
                color: #f7f4f2;
                font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
                transition: opacity 0.38s ease;
            }
            .vd-boot--leaving {
                opacity: 0;
                pointer-events: none;
            }
            .vd-boot__scene {
                position: absolute;
                inset: -4rem;
                background: url('/vindolar-boot.jpg') center / cover no-repeat;
                filter: blur(2px) saturate(1.15) brightness(0.72);
                opacity: 1;
                transform: scale(1.04);
            }
            .vd-boot__scene::after {
                content: '';
                position: absolute;
                inset: 0;
                background: rgb(12 8 22 / 35%);
            }
            .vd-boot__card {
                position: relative;
                width: min(46rem, 100%);
                padding: 2.8rem 2.8rem 2.4rem;
                border: 1px solid #6a350f;
                border-radius: 1.4rem;
                background: rgb(50 23 7 / 88%);
                box-shadow:
                    0 30px 80px rgb(0 0 0 / 55%),
                    inset 0 1px 0 rgb(255 255 255 / 8%);
                -webkit-backdrop-filter: blur(18px);
                backdrop-filter: blur(18px);
            }
            .vd-boot__brand {
                display: flex;
                align-items: center;
                gap: 1.2rem;
            }
            .vd-boot__mark {
                display: grid;
                flex: 0 0 auto;
                place-items: center;
                width: 4.4rem;
                height: 4.4rem;
                border-radius: 1.2rem;
                background: #542a0e;
            }
            .vd-boot__names {
                display: flex;
                flex: 1 1 auto;
                flex-direction: column;
                min-width: 0;
            }
            .vd-boot__names strong {
                font-family: 'Space Grotesk', 'DM Sans', sans-serif;
                font-size: 2.2rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .vd-boot__names small {
                color: #a6b1ce;
                font-size: 1.3rem;
            }
            .vd-boot__dots {
                display: flex;
                gap: 0.5rem;
            }
            .vd-boot__dots i {
                width: 0.7rem;
                height: 0.7rem;
                border-radius: 50%;
                background: #ff9136;
                animation: vd-boot-dot 1.2s ease-in-out infinite;
            }
            .vd-boot__dots i:nth-child(2) {
                animation-delay: 0.15s;
            }
            .vd-boot__dots i:nth-child(3) {
                animation-delay: 0.3s;
            }
            .vd-boot__status {
                min-height: 2rem;
                margin: 2.2rem 0 1.6rem;
                color: #f7f4f2;
                font-size: 1.4rem;
            }
            .vd-boot__meter-head {
                display: flex;
                justify-content: space-between;
                margin-bottom: 0.8rem;
                color: #a6b1ce;
                font-size: 1.1rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                font-variant-numeric: tabular-nums;
            }
            .vd-boot__bar {
                overflow: hidden;
                height: 0.8rem;
                border-radius: 1rem;
                background: #1a0b03;
            }
            .vd-boot__bar span {
                display: block;
                height: 100%;
                border-radius: 1rem;
                background: #ff9136;
            }
            @keyframes vd-boot-dot {
                0%,
                80%,
                100% {
                    opacity: 0.25;
                    transform: translateY(0);
                }
                40% {
                    opacity: 1;
                    transform: translateY(-0.4rem);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .vd-boot__dots i {
                    animation: none;
                    opacity: 0.7;
                }
            }
        </style>
    </head>

                                    stroke-linecap="round"
                                    stroke-linejoin="round"

                            </svg>
                        </span>
                        <span class="vd-boot__names">
                            <strong>Vindolar</strong>
                            <small>Vindolar Trading Workspace</small>
                        </span>
                        <span class="vd-boot__dots" aria-hidden="true"><i></i><i></i><i></i></span>
                    </div>
                    <p class="vd-boot__status">Loading Vindolar</p>
                    <div class="vd-boot__meter">
                        <div class="vd-boot__meter-head"><span>Boot sequence</span><span>4%</span></div>
                        <div class="vd-boot__bar"><span style="width: 4%"></span></div>
                    </div>
